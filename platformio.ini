; PlatformIO Project Configuration File
; Project: Acoustic Surface Touch Interface
; Board: ESP32 Dev Module

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = time, colorize

; Upload Settings
upload_speed = 921600

; Build Flags to optimize performance
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -O2

; Library Dependencies (Optional - for future Edge AI/DSP)
; lib_deps = 
;    tanakamasayuki/I2S @ ^1.0.0